<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5af19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f12711;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <!-- 舞台灯光效果 -->
  <ellipse cx="400" cy="300" rx="350" ry="200" fill="rgba(245,175,25,0.08)"/>
  <ellipse cx="400" cy="250" rx="200" ry="100" fill="rgba(245,175,25,0.06)"/>
  <!-- 音符装饰 -->
  <text x="80" y="150" font-size="80" fill="rgba(245,175,25,0.3)" font-family="serif">♪</text>
  <text x="650" y="200" font-size="60" fill="rgba(245,175,25,0.25)" font-family="serif">♫</text>
  <text x="100" y="480" font-size="50" fill="rgba(245,175,25,0.2)" font-family="serif">♬</text>
  <text x="620" y="500" font-size="70" fill="rgba(245,175,25,0.2)" font-family="serif">♪</text>
  <!-- 主标题 -->
  <text x="400" y="240" text-anchor="middle" font-size="72" font-weight="bold" fill="url(#gold1)" font-family="'Arial Black', sans-serif">周杰伦</text>
  <!-- 副标题 -->
  <text x="400" y="310" text-anchor="middle" font-size="42" fill="#ffffff" font-family="Arial, sans-serif">2026 嘉年华</text>
  <text x="400" y="360" text-anchor="middle" font-size="36" fill="#cccccc" font-family="Arial, sans-serif">世界巡回演唱会</text>
  <!-- 分隔线 -->
  <line x1="200" y1="390" x2="600" y2="390" stroke="url(#gold1)" stroke-width="2" opacity="0.6"/>
  <!-- 场次信息 -->
  <text x="400" y="430" text-anchor="middle" font-size="28" fill="#aaaaaa" font-family="Arial, sans-serif">北京国家体育场（鸟巢）</text>
  <text x="400" y="470" text-anchor="middle" font-size="26" fill="#888888" font-family="Arial, sans-serif">2026年8月20日 19:30</text>
  <!-- 标签 -->
  <rect x="320" y="490" width="160" height="40" rx="20" fill="rgba(245,175,25,0.2)" stroke="url(#gold1)" stroke-width="1.5"/>
  <text x="400" y="518" text-anchor="middle" font-size="20" fill="url(#gold1)" font-family="Arial, sans-serif">🎤 演唱会</text>
</svg>
