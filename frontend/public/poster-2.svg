<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pink2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6a88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff99ac;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <!-- 舞台聚光灯 -->
  <ellipse cx="400" cy="280" rx="300" ry="180" fill="rgba(255,106,136,0.1)"/>
  <ellipse cx="400" cy="220" rx="180" ry="100" fill="rgba(255,106,136,0.08)"/>
  <!-- 音符 -->
  <text x="70" y="160" font-size="80" fill="rgba(255,106,136,0.3)" font-family="serif">♫</text>
  <text x="660" y="190" font-size="60" fill="rgba(255,106,136,0.25)" font-family="serif">♪</text>
  <text x="90" y="490" font-size="50" fill="rgba(255,106,136,0.2)" font-family="serif">♬</text>
  <text x="640" y="510" font-size="65" fill="rgba(255,106,136,0.2)" font-family="serif">♫</text>
  <!-- 星星 -->
  <text x="720" y="120" font-size="30" fill="rgba(255,255,255,0.3)">✦</text>
  <text x="60" y="300" font-size="24" fill="rgba(255,255,255,0.2)">✦</text>
  <text x="740" y="400" font-size="20" fill="rgba(255,255,255,0.15)">✦</text>
  <!-- 主标题 -->
  <text x="400" y="230" text-anchor="middle" font-size="68" font-weight="bold" fill="url(#pink2)" font-family="'Arial Black', sans-serif">五月天</text>
  <!-- 副标题 -->
  <text x="400" y="300" text-anchor="middle" font-size="40" fill="#ffffff" font-family="Arial, sans-serif">好好好想见到你</text>
  <text x="400" y="350" text-anchor="middle" font-size="34" fill="#cccccc" font-family="Arial, sans-serif">2026 巡回演唱会</text>
  <!-- 分隔线 -->
  <line x1="200" y1="385" x2="600" y2="385" stroke="url(#pink2)" stroke-width="2" opacity="0.6"/>
  <!-- 场次信息 -->
  <text x="400" y="425" text-anchor="middle" font-size="28" fill="#aaaaaa" font-family="Arial, sans-serif">上海梅赛德斯奔驰中心</text>
  <text x="400" y="465" text-anchor="middle" font-size="26" fill="#888888" font-family="Arial, sans-serif">2026年9月15日 19:00</text>
  <!-- 标签 -->
  <rect x="320" y="490" width="160" height="40" rx="20" fill="rgba(255,106,136,0.2)" stroke="url(#pink2)" stroke-width="1.5"/>
  <text x="400" y="518" text-anchor="middle" font-size="20" fill="url(#pink2)" font-family="Arial, sans-serif">🎸 演唱会</text>
</svg>
