<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000428;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004e92;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyan3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <!-- 宇宙光芒 -->
  <ellipse cx="400" cy="280" rx="320" ry="190" fill="rgba(0,210,255,0.07)"/>
  <ellipse cx="400" cy="200" rx="200" ry="100" fill="rgba(0,210,255,0.05)"/>
  <!-- 星星/粒子 -->
  <text x="80" y="140" font-size="70" fill="rgba(0,210,255,0.3)" font-family="serif">✦</text>
  <text x="680" y="160" font-size="50" fill="rgba(0,210,255,0.25)" font-family="serif">✧</text>
  <text x="60" y="460" font-size="40" fill="rgba(0,210,255,0.2)" font-family="serif">✦</text>
  <text x="720" y="480" font-size="55" fill="rgba(0,210,255,0.2)" font-family="serif">✧</text>
  <text x="120" y="280" font-size="20" fill="rgba(255,255,255,0.2)">✦</text>
  <text x="670" y="350" font-size="16" fill="rgba(255,255,255,0.15)">✧</text>
  <!-- 飞碟/飞船装饰 -->
  <ellipse cx="600" cy="130" rx="40" ry="15" fill="rgba(0,210,255,0.15)"/>
  <ellipse cx="600" cy="128" rx="30" ry="10" fill="rgba(0,210,255,0.3)"/>
  <!-- 主标题 -->
  <text x="400" y="230" text-anchor="middle" font-size="68" font-weight="bold" fill="url(#cyan3)" font-family="'Arial Black', sans-serif">薛之谦</text>
  <!-- 副标题 -->
  <text x="400" y="300" text-anchor="middle" font-size="48" fill="#ffffff" font-family="Arial, sans-serif">天外来物</text>
  <text x="400" y="355" text-anchor="middle" font-size="32" fill="#cccccc" font-family="Arial, sans-serif">2026 巡回演唱会</text>
  <!-- 分隔线 -->
  <line x1="200" y1="390" x2="600" y2="390" stroke="url(#cyan3)" stroke-width="2" opacity="0.6"/>
  <!-- 场次信息 -->
  <text x="400" y="430" text-anchor="middle" font-size="28" fill="#aaaaaa" font-family="Arial, sans-serif">深圳春茧体育馆</text>
  <text x="400" y="470" text-anchor="middle" font-size="26" fill="#888888" font-family="Arial, sans-serif">2026年10月1日 19:30</text>
  <!-- 标签 -->
  <rect x="320" y="490" width="160" height="40" rx="20" fill="rgba(0,210,255,0.15)" stroke="url(#cyan3)" stroke-width="1.5"/>
  <text x="400" y="518" text-anchor="middle" font-size="20" fill="url(#cyan3)" font-family="Arial, sans-serif">🚀 演唱会</text>
</svg>
